apiVersion: v1
kind: Namespace
metadata:
  name: ai-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-test
  namespace: ai-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-test
  template:
    metadata:
      labels:
        app: smoke-test
    spec:
      containers:
      - name: echoserver
        image: ealen/echo-server:latest
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"
---
apiVersion: v1
kind: v1
apiVersion: v1
kind: Service
metadata:
  name: smoke-test-svc
  namespace: ai-lab
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: smoke-test
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smoke-test-ingress
  namespace: ai-lab
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - test.zyklab.me
    secretName: smoke-test-tls
  rules:
  - host: test.zyklab.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: smoke-test-svc
            port:
              number: 80
