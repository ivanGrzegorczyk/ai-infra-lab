apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: ai-lab
spec:
  selector:
    app: ollama
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-server
  namespace: ai-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      initContainers:
      - name: pull-model
        image: ollama/ollama:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve & 
            sleep 5; 
            ollama pull llama3.1:8b;
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        - name: OLLAMA_NUM_PARALLEL # Permite procesar N pedidos a la vez
          value: "4" 
        - name: OLLAMA_MAX_LOADED_MODELS # Permite tener más de un modelo en memoria
          value: "2"
        resources:
          requests:
            cpu: "500m" 
            memory: "8Gi" 
          limits:
            cpu: "4000m" 
            memory: "16Gi"
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: llama-models-pvc
