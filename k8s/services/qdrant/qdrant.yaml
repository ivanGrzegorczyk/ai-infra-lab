apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: ai-lab
  labels:
    app: qdrant
spec:
  ports:
  - port: 6333
    name: http-api
    targetPort: 6333
  - port: 6334
    name: grpc-api
    targetPort: 6334
  selector:
    app: qdrant
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: ai-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant-db
  namespace: ai-lab
spec:
  serviceName: "qdrant-service"
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.7.4
        ports:
        - containerPort: 6333
          name: http-api
        - containerPort: 6334
          name: grpc-api
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 6333
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 6333
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: qdrant-data
        persistentVolumeClaim:
          claimName: qdrant-storage
