<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AI Infra Gateway - Playground</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #ddd; max-width: 800px; margin: 40px auto; padding: 20px; }
        #chat { background: #2d2d2d; border-radius: 8px; padding: 20px; min-height: 300px; margin-bottom: 20px; white-space: pre-wrap; line-height: 1.5; border: 1px solid #444; overflow-y: auto; max-height: 500px; }
        .controls { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; border-radius: 4px; border: 1px solid #444; background: #3d3d3d; color: white; }
        button { padding: 10px 20px; border-radius: 4px; border: none; background: #007acc; color: white; cursor: pointer; font-weight: bold; }
        button:disabled { background: #555; }
        .provider-badge { font-size: 0.8em; color: #00ff00; margin-bottom: 8px; font-weight: bold; display: block; }
        .message-content { color: #eee; }
        .error { color: #ff5555; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🚀 AI Infra Gateway Playground</h2>
    <div id="chat">Esperando prompt...</div>
    <div class="controls">
        <input type="text" id="prompt" placeholder="Escribí tu mensaje aquí..." value="Contame en tres párrafos por qué Go es ideal para infra de IA.">
        <button id="sendBtn">Enviar</button>
    </div>

    <script>
        const chatDiv = document.getElementById('chat');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('sendBtn');

        sendBtn.addEventListener('click', async () => {
            const prompt = promptInput.value;
            if (!prompt) return;

            // Limpiar chat y deshabilitar botón
            chatDiv.innerHTML = ''; 
            sendBtn.disabled = true;

            // Variables de referencia para este mensaje específico
            let contentElement = null;
            let providerDetected = false;

            try {
                const response = await fetch('https://chat.zyklab.me/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "llama3.1:8b",
                        messages: [{ role: "user", content: prompt }],
                        stream: true
                    })
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        
                        const data = line.slice(6).trim();
                        if (data === '[DONE]') continue;

                        try {
                            const json = JSON.parse(data);

                            // Si es el primer token, creamos la estructura del mensaje
                            if (!providerDetected) {
                                // Crear Badge del proveedor
                                const badge = document.createElement('span');
                                badge.className = 'provider-badge';
                                badge.innerText = `Respondido por: ${json.provider.toUpperCase()}`;
                                chatDiv.appendChild(badge);

                                // Crear contenedor de texto y guardar la referencia
                                contentElement = document.createElement('span');
                                contentElement.className = 'message-content';
                                chatDiv.appendChild(contentElement);
                                
                                providerDetected = true;
                            }

                            // Actualizar el contenido usando la referencia de memoria directa
                            if (contentElement && json.content) {
                                contentElement.innerText += json.content;
                            }
                            
                            window.scrollTo(0, document.body.scrollHeight);
                        } catch (e) {
                            // Ignorar errores de JSON incompleto en el stream
                        }
                    }
                }
            } catch (err) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.innerText = "Error: " + err.message;
                chatDiv.appendChild(errorDiv);
            } finally {
                sendBtn.disabled = false;
            }
        });

        // Permitir enviar con Enter
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
