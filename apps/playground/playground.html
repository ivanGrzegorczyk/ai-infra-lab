<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AI Infra Gateway - Playground v4.1</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #ddd; max-width: 1000px; margin: 20px auto; padding: 20px; }
        
        #chat { 
            background: #2d2d2d; border-radius: 8px; padding: 20px; min-height: 450px; 
            margin-bottom: 20px; white-space: pre-wrap; line-height: 1.6; border: 1px solid #444; 
            overflow-y: auto; max-height: 600px; scroll-behavior: smooth;
        }
        
        .config-panel { background: #252526; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .input-group { display: flex; gap: 5px; }
        label { font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; }
        input, select { background: #333; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; outline: none; }
        
        .input-area { display: flex; gap: 10px; width: 100%; }
        #prompt { flex: 1; padding: 15px; border-radius: 6px; border: 1px solid #444; background: #252526; color: #fff; font-size: 16px; min-width: 0; }
        
        button { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #sendBtn { background: #007acc; color: white; }
        #sendBtn:hover { background: #005f9e; }
        .icon-btn { background: #444; color: #ddd; padding: 8px 12px; }
        .icon-btn:hover { background: #555; }
        button:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }

        .provider-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #444; color: #aaa; margin-bottom: 4px; display: inline-block; }
        .message-content { display: block; margin-bottom: 15px; }
        .error { color: #f44336; background: rgba(244, 67, 54, 0.1); padding: 10px; border-radius: 4px; margin: 10px 0; border-left: 4px solid #f44336; }
        .info { color: #ff9800; font-style: italic; font-size: 0.9em; margin: 5px 0; }
        .session-info { font-size: 11px; color: #666; margin-top: 5px; font-family: monospace; }
        hr { border: 0; border-top: 1px solid #333; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="config-panel">
        <div class="field">
            <label>API Key</label>
            <div class="input-group">
                <input type="password" id="apiKey" placeholder="sk-..." value="">
                <button id="toggleKeyBtn" class="icon-btn" title="Mostrar/Ocultar">Ver</button>
            </div>
        </div>
        <div class="field">
            <label>Proveedor Preferido</label>
            <select id="provider">
                <option value="ollama" selected>Ollama (Local - Private)</option>
                <option value="groq">Groq (Llama 3.1 - Fast)</option>
            </select>
        </div>
        <div class="field">
            <label>ID de Sesión</label>
            <div id="sessionIdDisplay" class="session-info">Generando...</div>
        </div>
    </div>

    <div id="chat"></div>

    <div class="input-area">
        <input type="text" id="prompt" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
        <button id="sendBtn">Enviar</button>
        <button id="newSessionBtn" class="icon-btn" title="Nueva conversación">Limpiar</button>
    </div>

    <script>
        const chatDiv = document.getElementById('chat');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('sendBtn');
        const newSessionBtn = document.getElementById('newSessionBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const toggleKeyBtn = document.getElementById('toggleKeyBtn');
        const providerSelect = document.getElementById('provider');
        const sessionDisplay = document.getElementById('sessionIdDisplay');

        // Revelar API Key
        toggleKeyBtn.addEventListener('click', () => {
            apiKeyInput.type = apiKeyInput.type === 'password' ? 'text' : 'password';
        });

        // Gestión de Sesión
        function getOrGenerateSession() {
            let sid = localStorage.getItem('ai_gateway_session');
            if (!sid) {
                sid = 'session-' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('ai_gateway_session', sid);
            }
            sessionDisplay.innerText = sid;
            return sid;
        }

        let currentSessionId = getOrGenerateSession();

        newSessionBtn.addEventListener('click', () => {
            if (confirm('¿Quieres empezar una nueva conversación?')) {
                localStorage.removeItem('ai_gateway_session');
                currentSessionId = getOrGenerateSession();
                chatDiv.innerHTML = '';
                promptInput.value = '';
                promptInput.focus();
            }
        });

        // Lógica de Envío
        sendBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            
            if (!prompt || !apiKey) return;

            sendBtn.disabled = true;
            chatDiv.innerHTML += `<div><b>Tú:</b> ${prompt}</div>`;
            promptInput.value = '';
            
            let providerDetected = false;
            let contentElement = null;

            try {
                const response = await fetch('https://chat.zyklab.me/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        preferred_provider: providerSelect.value,
                        messages: [{ role: 'user', content: prompt }]
                    })
                });

                if (!response.ok) throw new Error(await response.text() || 'Error en servidor');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;

                            try {
                                const json = JSON.parse(data);
                                if (json.provider === 'gateway-info') {
                                    chatDiv.innerHTML += `<div class="info">${json.content}</div>`;
                                    continue;
                                }

                                if (!providerDetected) {
                                    chatDiv.innerHTML += `<div><span class="provider-badge">${json.provider.toUpperCase()}</span></div>`;
                                    contentElement = document.createElement('span');
                                    contentElement.className = 'message-content';
                                    chatDiv.appendChild(contentElement);
                                    providerDetected = true;
                                }

                                if (json.content) contentElement.innerText += json.content;
                                scrollToBottom();
                            } catch (e) {}
                        }
                    }
                }
            } catch (err) {
                chatDiv.innerHTML += `<div class="error"><b>Error:</b> ${err.message}</div>`;
            } finally {
                sendBtn.disabled = false;
                chatDiv.innerHTML += '<hr>';
                scrollToBottom();
            }
        });

        function scrollToBottom() { chatDiv.scrollTop = chatDiv.scrollHeight; }
        promptInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });
        promptInput.focus();
    </script>
</body>
</html>
