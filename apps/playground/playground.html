<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Infra Gateway - Lab Console</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-color: #252526;
            --border-color: #3e3e42;
            --accent-color: #007acc;
            --text-main: #cccccc;
            --text-dim: #858585;
            --success-color: #4ec9b0;
            --error-color: #f48771;
            --warning-color: #cca700;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #333333;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .header-actions { display: flex; gap: 10px; }

        .btn-header {
            background-color: #2d2d2d;
            color: var(--text-main);
            text-decoration: none;
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-header:hover { background-color: #3e3e42; }
        .btn-header.danger:hover { background-color: #5a1e1e; border-color: #f48771; }

        /* Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 320px;
            background-color: var(--panel-color);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .panel-section {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        .panel-section:last-child { border-bottom: none; }

        h2 { font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-top: 0; margin-bottom: 10px; }

        label { display: block; font-size: 11px; margin-bottom: 5px; color: var(--text-main); }
        
        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 8px;
            background-color: #3c3c3c;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
            margin-bottom: 10px;
        }
        input:focus, select:focus { border-color: var(--accent-color); }

        /* API Key Group */
        .input-group { display: flex; gap: 5px; margin-bottom: 10px;}
        .input-group input { margin-bottom: 0; }
        .toggle-btn {
            background: #3c3c3c; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; font-size: 11px; border-radius: 3px;
        }
        .toggle-btn:hover { background: #4e4e50; }

        /* Drag & Drop Zone */
        .drop-zone {
            border: 2px dashed #444;
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
            background: #2d2d2d;
        }
        .drop-zone:hover { border-color: var(--accent-color); background: #333; }
        .drop-zone.active { border-color: var(--accent-color); background: #383838; }
        .drop-zone p { margin: 0; font-size: 12px; color: #888; pointer-events: none; }
        .drop-zone strong { color: var(--accent-color); }

        /* Buttons */
        .action-btn {
            width: 100%;
            padding: 8px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        .action-btn:hover { background-color: #0062a3; }
        .action-btn:disabled { background-color: #444; color: #888; cursor: not-allowed; }

        /* Status Bar */
        .status-container {
            margin-top: 10px;
            background: #111;
            padding: 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            display: none;
        }
        .status-bar { height: 4px; background: #333; margin-top: 5px; border-radius: 2px; overflow: hidden; }
        .status-fill { height: 100%; background: var(--accent-color); width: 0%; transition: width 0.3s; }
        .status-text { display: block; margin-bottom: 2px; }

        /* Main Chat */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background-color: #1e1e1e;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            background-color: #252526;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 85%;
            word-wrap: break-word;
        }
        .message.user { align-self: flex-end; background-color: #264f78; color: white; }
        .message.assistant { align-self: flex-start; background-color: #333333; color: #d4d4d4; }
        .message.system { align-self: center; font-style: italic; color: var(--text-dim); font-size: 12px; }
        
        /* Estilos para mensajes de información (ej: Switching provider) */
        .message.info { 
            align-self: center; 
            background: rgba(204, 167, 0, 0.15);
            color: var(--warning-color); 
            font-size: 12px; 
            width: 90%; 
            text-align: center;
            border: 1px solid rgba(204, 167, 0, 0.3);
        }
        
        .message.error { 
            align-self: center; 
            background-color: #3e1e1e; 
            color: var(--error-color); 
            border: 1px solid var(--error-color); 
            width: 90%;
            text-align: center;
        }
        
        .provider-tag {
            display: inline-block; font-size: 10px; background: black; padding: 2px 4px; 
            border-radius: 2px; margin-right: 5px; color: #aaa; text-transform: uppercase;
        }

        .chat-input-area { display: flex; gap: 10px; }
        #prompt-input { flex: 1; }

    </style>
</head>
<body>

    <header>
        <h1>AI Infra Gateway <span style="font-size: 0.7em; color: #666; margin-left:10px;">Lab Console</span></h1>
        <div class="header-actions">
            <button id="clear-chat-btn" class="btn-header danger">Limpiar / Nueva Sesión</button>
            <a href="https://github.com/ivanGrzegorczyk/ai-infra-lab" target="_blank" class="btn-header">GitHub Repo</a>
        </div>
    </header>

    <div class="container">
        <aside>
            <div class="panel-section">
                <h2>Conexión</h2>
                <label>Host URL</label>
                <input type="text" id="host-url" value="https://chat.zyklab.me">
                
                <label>API Key</label>
                <div class="input-group">
                    <input type="password" id="api-key" placeholder="sk-...">
                    <button type="button" id="toggle-key-btn" class="toggle-btn">Ver</button>
                </div>
            </div>

            <div class="panel-section">
                <h2>Preferencias</h2>
                <label>Proveedor</label>
                <select id="provider-select">
                    <option value="ollama">Ollama (Local)</option>
                    <option value="groq">Groq (Cloud)</option>
                </select>
                
                <label>ID Sesión</label>
                <input type="text" id="session-id" readonly style="background: #2d2d2d; color: #666; cursor: default;">
            </div>

            <div class="panel-section">
                <h2>Ingesta de Conocimiento</h2>
                
                <div class="drop-zone" id="drop-zone">
                    <p>Arrastra tu archivo <strong>.txt</strong> o <strong>.md</strong> aquí</p>
                    <p style="font-size:10px; margin-top:5px;">o haz click para buscar</p>
                </div>
                <input type="file" id="file-input" accept=".txt,.md,.json" style="display: none;">
                
                <button id="ingest-btn" class="action-btn" disabled>Aprender Documento</button>

                <div id="status-container" class="status-container">
                    <span id="status-text" class="status-text">Iniciando...</span>
                    <div class="status-bar"><div id="status-fill" class="status-fill"></div></div>
                </div>
            </div>
        </aside>

        <main>
            <div id="chat-history">
                <div class="message system">Sistema listo.</div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="prompt-input" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
                <button id="send-btn" class="action-btn" style="width: 100px;">Enviar</button>
            </div>
        </main>
    </div>

    <script>
        // --- ELEMENTOS DOM ---
        const hostInput = document.getElementById('host-url');
        const apiKeyInput = document.getElementById('api-key');
        const toggleKeyBtn = document.getElementById('toggle-key-btn');
        const sessionIdInput = document.getElementById('session-id');
        const clearChatBtn = document.getElementById('clear-chat-btn');
        
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const ingestBtn = document.getElementById('ingest-btn');
        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status-text');
        const statusFill = document.getElementById('status-fill');
        
        const chatHistory = document.getElementById('chat-history');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        const providerSelect = document.getElementById('provider-select');

        // --- GESTIÓN DE SESIÓN ---
        function generateSession() {
            const sid = 'sess-' + Math.random().toString(36).substring(2, 10);
            localStorage.setItem('ai_gateway_session', sid);
            return sid;
        }

        function initSession() {
            let sid = localStorage.getItem('ai_gateway_session');
            if (!sid) sid = generateSession();
            sessionIdInput.value = sid;
        }

        clearChatBtn.onclick = () => {
            if(confirm("¿Seguro que quieres borrar el chat y generar una nueva sesión?")) {
                chatHistory.innerHTML = '<div class="message system">Chat reiniciado. Nueva sesión generada.</div>';
                sessionIdInput.value = generateSession();
            }
        };

        initSession();

        // --- TOGGLE API KEY ---
        toggleKeyBtn.onclick = () => {
            if (apiKeyInput.type === "password") {
                apiKeyInput.type = "text";
                toggleKeyBtn.innerText = "Ocultar";
            } else {
                apiKeyInput.type = "password";
                toggleKeyBtn.innerText = "Ver";
            }
        };

        // --- DRAG & DROP & FILE HANDLING ---
        dropZone.onclick = () => fileInput.click();
        
        fileInput.onchange = (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        };

        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('active'); };
        dropZone.ondragleave = (e) => { e.preventDefault(); dropZone.classList.remove('active'); };
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        };

        let selectedFile = null;

        function handleFile(file) {
            selectedFile = file;
            dropZone.innerHTML = `<p style="color:white; font-weight:bold;">${file.name}</p><p>${(file.size/1024).toFixed(1)} KB</p>`;
            ingestBtn.disabled = false;
        }

        // --- LÓGICA DE INGESTA (RAG) ---
        ingestBtn.onclick = async () => {
            if (!selectedFile) return;
            const host = hostInput.value.replace(/\/$/, "");
            const apiKey = apiKeyInput.value.trim();

            if (!apiKey) {
                alert("Por favor ingresa tu API Key");
                return;
            }

            // UI Update
            ingestBtn.disabled = true;
            statusContainer.style.display = 'block';
            updateStatus('Leyendo archivo...', 10, '#007acc');

            const reader = new FileReader();
            reader.readAsText(selectedFile);
            reader.onload = async () => {
                const textContent = reader.result;
                
                try {
                    // Paso 1: Enviar Request
                    updateStatus('Enviando al servidor...', 30, '#007acc');
                    const res = await fetch(`${host}/v1/ingest`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-API-Key': apiKey
                        },
                        body: JSON.stringify({
                            content: textContent,
                            metadata: { 
                                filename: selectedFile.name,
                                uploaded_at: new Date().toISOString()
                            }
                        })
                    });

                    if (!res.ok) {
                        const errorText = await res.text();
                        throw new Error(errorText || `HTTP ${res.status}`);
                    }
                    
                    const data = await res.json();
                    const jobId = data.id;
                    updateStatus(`Job iniciado: ${jobId.substring(0, 8)}...`, 50, '#cca700');

                    // Paso 2: Polling
                    pollJobStatus(host, apiKey, jobId);

                } catch (e) {
                    updateStatus('Error: ' + e.message, 100, '#f48771');
                    addMessage('error', `Error al ingestar documento: ${e.message}`);
                    ingestBtn.disabled = false;
                }
            };
        };

        async function pollJobStatus(host, apiKey, jobId) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${host}/v1/ingest/status/${jobId}`, {
                        headers: { 'X-API-Key': apiKey }
                    });
                    
                    if (!res.ok) {
                        clearInterval(interval);
                        const errorText = await res.text();
                        throw new Error(errorText || `HTTP ${res.status}`);
                    }
                    
                    const job = await res.json();

                    if (job.status === 'completed') {
                        clearInterval(interval);
                        updateStatus('Completado: ' + job.message, 100, '#4ec9b0');
                        addMessage('info', 'Documento aprendido exitosamente. Ahora puedes hacer preguntas sobre él.');
                        setTimeout(() => {
                            selectedFile = null;
                            dropZone.innerHTML = '<p>Arrastra un archivo aquí o <strong>haz clic</strong></p><p style="font-size:11px; color:#666; margin-top:5px;">Solo archivos de texto (.txt, .md, .json)</p>';
                            ingestBtn.disabled = true;
                            statusContainer.style.display = 'none';
                        }, 3000);
                    } else if (job.status === 'failed') {
                        clearInterval(interval);
                        updateStatus('Error: ' + job.message, 100, '#f48771');
                        addMessage('error', 'Error procesando documento: ' + job.message);
                        ingestBtn.disabled = false;
                    } else if (job.status === 'processing') {
                        updateStatus('Procesando chunks...', 70, '#cca700');
                    } else {
                        updateStatus('En cola...', 60, '#007acc');
                    }
                } catch (e) {
                    clearInterval(interval);
                    updateStatus('Error: ' + e.message, 100, '#f48771');
                    addMessage('error', 'Error al consultar estado del job: ' + e.message);
                    ingestBtn.disabled = false;
                }
            }, 1000);
        }

        function updateStatus(text, percent, color) {
            statusText.innerText = text;
            statusFill.style.width = percent + '%';
            statusFill.style.backgroundColor = color;
        }

        // --- LÓGICA DE CHAT ---
        sendBtn.onclick = async () => {
            const text = promptInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            
            if (!text) return;
            if (!apiKey) {
                alert("Por favor ingresa tu API Key");
                return;
            }

            const host = hostInput.value.replace(/\/$/, "");
            addMessage('user', text);
            promptInput.value = '';
            sendBtn.disabled = true;

            try {
                const res = await fetch(`${host}/v1/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({
                        session_id: sessionIdInput.value,
                        preferred_provider: providerSelect.value,
                        messages: [{ role: 'user', content: text }]
                    })
                });

                if (!res.ok) throw new Error(await res.text());

                // Leer Stream
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let assistantDiv = null;
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') break;
                            try {
                                const json = JSON.parse(data);
                                
                                // 1. Manejo de mensajes de sistema (Fallback, Info)
                                if (json.provider === 'gateway-info') {
                                    addMessage('info', json.content);
                                    continue;
                                }

                                // 2. Mensaje del asistente
                                if (!assistantDiv) assistantDiv = addMessage('assistant', '');
                                
                                buffer += json.content;
                                assistantDiv.innerHTML = `<span class="provider-tag">${json.provider || 'AI'}</span>` + buffer.replace(/\n/g, '<br>');
                                chatHistory.scrollTop = chatHistory.scrollHeight;
                            } catch (e) {}
                        }
                    }
                }

            } catch (e) {
                addMessage('error', 'Error: ' + e.message);
            } finally {
                sendBtn.disabled = false;
                promptInput.focus();
            }
        };

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return div;
        }

        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });

    </script>
</body>
</html>
