apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: ai-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      containers:
      - name: ai-gateway
        image: ivangrz/ai-infra-gateway:1.1.4
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: OLLAMA_URL
          value: "http://ollama-service.ai-lab.svc.cluster.local:11434"
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-gateway-secrets
              key: GROQ_API_KEY
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "100m"
        volumeMounts:
        - name: keys-volume
          mountPath: /app/configs/keys.json
          subPath: keys.json
      volumes:
      - name: keys-volume
        secret:
          secretName: ai-gateway-keys
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-service
  namespace: ai-lab
  labels:
    app: ai-gateway
spec:
  selector:
    app: ai-gateway
  ports:
    - name: http-metrics
      protocol: TCP
      port: 80
      targetPort: 8080
