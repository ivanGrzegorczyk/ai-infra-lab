apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: ai-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      containers:
      - name: ai-gateway
        image: ivanzyk/ai-infra-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: OLLAMA_URL
          value: "http://ollama-service.ai-lab.svc.cluster.local:11434"
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-service
  namespace: ai-lab
spec:
  selector:
    app: ai-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
